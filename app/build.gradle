plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.jellybeanlauncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.jellybeanlauncher"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
